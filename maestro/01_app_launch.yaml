appId: com.curacard.curacard
---
# Flow 1: Pembukaan Aplikasi (App Launch & Splash / Onboarding)
# Memverifikasi aplikasi berhasil dibuka, splash & onboarding tampil dengan benar,
# serta dapat bernavigasi ke layar autentikasi (Auth Screen).

- launchApp:
    clearState: true

# Tunggu sejenak hingga halaman onboarding siap
- extendedWaitUntil:
    visible: "Lewati"
    timeout: 15000

# Ambil bukti screenshot pada tahap pembukaan aplikasi / onboarding
- takeScreenshot: screenshots/01_app_launch_onboarding

# Lewati onboarding menuju halaman login/daftar
- tapOn: "Lewati"

# Tunggu dan verifikasi elemen penting di Auth Screen
- extendedWaitUntil:
    visible: "Selamat Datang di CuraCard"
    timeout: 10000

- assertVisible: "Selamat Datang di CuraCard"
- assertVisible: "Masuk"
- assertVisible: "Daftar"

# Ambil bukti screenshot layar Autentikasi
- takeScreenshot: screenshots/01_auth_screen_ready
